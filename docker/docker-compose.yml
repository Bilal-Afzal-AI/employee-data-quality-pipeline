version: "3.9"

services:

  postgres:
    image: postgres:13
    container_name: dq_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123456
      POSTGRES_DB: airflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: airflow_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:Postgres123456@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: "super-secret-airflow-key"
      PYTHONPATH: /opt/airflow:/opt/airflow/mlflow_tracking:/opt/airflow/validation_engine

    volumes:
      - ../dags:/opt/airflow/dags
      - ../validation_engine:/opt/airflow/validation_engine
      - ../mlflow_tracking:/opt/airflow/mlflow_tracking
      - airflow_logs:/opt/airflow/logs

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username airflow
      --password airflow
      --firstname admin
      --lastname user
      --role Admin
      --email admin@example.com || true
      "


  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-webserver
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:Postgres123456@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: "super-secret-airflow-key"
      PYTHONPATH: /opt/airflow:/opt/airflow/mlflow_tracking:/opt/airflow/validation_engine

    ports:
      - "8080:8080"

    volumes:
      - ../dags:/opt/airflow/dags
      - ../validation_engine:/opt/airflow/validation_engine
      - ../mlflow_tracking:/opt/airflow/mlflow_tracking
      - airflow_logs:/opt/airflow/logs

    command: airflow webserver


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:Postgres123456@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: "super-secret-airflow-key"
      PYTHONPATH: /opt/airflow:/opt/airflow/mlflow_tracking:/opt/airflow/validation_engine

    volumes:
      - ../dags:/opt/airflow/dags
      - ../validation_engine:/opt/airflow/validation_engine
      - ../mlflow_tracking:/opt/airflow/mlflow_tracking
      - airflow_logs:/opt/airflow/logs

    command: airflow scheduler


  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlflow
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - mlflow_data:/mlflow

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts "*"


  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset

    container_name: superset
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SUPERSET_SECRET_KEY: "superset-secret-key"

    ports:
      - "8088:8088"

    volumes:
      - superset_home:/app/superset_home

    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname admin
      --lastname admin
      --email admin@admin.com
      --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "


volumes:
  postgres_data:
  airflow_logs:
  mlflow_data:
  superset_home: